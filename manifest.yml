modules:
  jira:issuePanel:
    - key: devcontext-ai-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: devcontext-ai
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/b4f5d91d-4436-48c1-8653-50a80be9c8bf
